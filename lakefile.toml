name = "lean-poly-mcp"
version = "0.1.0"
defaultTargets = ["Poly", "Tactics", "Mcp", "Oracle", "Formalize", "Aristotle", "Agent", "server", "agent-run"]

# Pinned to Aristotle's exact Mathlib: commit 8f9d9cff is the tag v4.28.0, and is
# literally the commit titled "chore: bump toolchain to v4.28.0".
#
# Do NOT bump this to chase a newer Mathlib. Re-verifying Aristotle's output against our
# own kernel is the whole trust story, and it only works if both sides speak the same
# Mathlib — under skew, a failed re-verification is ambiguous between "unsound" and "a
# lemma got renamed", which is precisely the ambiguity the oracle exists to remove.
# See docs/lean-upgrade-plan.md §3.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "8f9d9cff6bd728b17a24e163c9402775d9e6a365"

[[lean_lib]]
name = "Poly"

[[lean_lib]]
name = "Tactics"

[[lean_lib]]
name = "Mcp"

[[lean_lib]]
name = "Oracle"

[[lean_lib]]
name = "Formalize"

[[lean_lib]]
name = "Aristotle"

[[lean_lib]]
name = "Agent"

# The MCP server binary: JSON-RPC over stdio, the same interface v1-idris/ exposes.
[[lean_exe]]
name = "agent-run"
root = "Agent.Main"
supportInterpreter = true

[[lean_exe]]
name = "server"
root = "Mcp.Main"
supportInterpreter = true
