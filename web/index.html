<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathlib Statement Miner</title>
<style>
  :root {
    --bg: #f7f7f4;
    --panel: #ffffff;
    --ink: #202124;
    --muted: #6d7178;
    --line: #dfe3e6;
    --accent: #275f76;
    --accent-ink: #ffffff;
    --ok: #217346;
    --miss: #a13f22;
    --code: #f0f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --panel: #191c20;
      --ink: #e7eaee;
      --muted: #a3a9b1;
      --line: #313740;
      --accent: #6bb3cf;
      --accent-ink: #081115;
      --ok: #75c991;
      --miss: #ed8b67;
      --code: #11161b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 34px 20px 56px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 720;
  }
  button {
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 650;
    padding: 9px 15px;
    cursor: pointer;
  }
  button:disabled {
    opacity: .55;
    cursor: default;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
  }
  .empty {
    color: var(--muted);
    padding: 28px 0;
    text-align: center;
  }
  .topline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 3px;
  }
  .decl {
    color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .badge {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .badge.solved {
    color: var(--ok);
  }
  .badge.miss {
    color: var(--miss);
  }
  .badge.good {
    color: var(--ok);
  }
  .badge.maybe {
    color: #9a6a14;
  }
  .badge.skip {
    color: var(--miss);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 12px 0;
  }
  .stat {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px;
    min-width: 0;
  }
  .stat div:last-child {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    overflow-wrap: anywhere;
  }
  pre {
    max-height: 430px;
    overflow: auto;
    margin: 10px 0 0;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--code);
    color: var(--ink);
    font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .meta {
    color: var(--muted);
    font-size: 12.5px;
  }
  .error {
    color: var(--miss);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
  }
  ul.reasons {
    margin: 8px 0 0;
    padding-left: 20px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 720px) {
    header { align-items: stretch; flex-direction: column; }
    button { width: 100%; }
    .topline { flex-direction: column; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mathlib Statement Miner</h1>
    <button id="mine">Mine statement</button>
  </header>

  <section class="panel" id="result">
    <div class="empty">No statement mined yet.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let currentEntry = null;
let currentProjectId = null;

function render(data) {
  if (data.error) {
    $("result").innerHTML = `<div class="error">${esc(data.error)}</div>`;
    return;
  }

  const entry = data.entry;
  const verdict = entry.verdict || {};
  const quality = entry.quality || { label: "skip", score: 0, reasons: [] };
  const solved = verdict.outcome === "solved";
  const miss = verdict.outcome === "interesting_miss";
  const tried = verdict.tried || [];
  const axioms = verdict.axioms || [];
  const badge = solved ? "solved locally" : miss ? "interesting miss" : verdict.outcome || "unknown";
  const canSubmit = miss && quality.label !== "skip";
  currentEntry = entry;
  currentProjectId = null;

  $("result").innerHTML = `
    <div class="topline">
      <div>
        <div class="label">Mathlib declaration</div>
        <div class="decl">${esc(entry.name)}</div>
      </div>
      <div class="badge ${solved ? "solved" : miss ? "miss" : ""}">${esc(badge)}</div>
    </div>

    <div class="grid">
      <div class="stat"><div class="label">topic</div><div>${esc(entry.topic)}</div></div>
      <div class="stat"><div class="label">position</div><div>${data.index}/${data.count}</div></div>
      <div class="stat"><div class="label">local result</div><div>${esc(entry.summary)}</div></div>
      <div class="stat"><div class="label">${solved ? "axioms" : "tried"}</div><div>${solved ? esc(axioms.join(", ") || "none") : tried.length}</div></div>
    </div>

    <div class="panel" style="padding:12px; margin-top:12px">
      <div class="topline" style="margin-bottom:0">
        <div>
          <div class="label">Aristotle candidate quality</div>
          <div><span class="badge ${esc(quality.label)}">${esc(quality.label)} · ${quality.score}/100</span></div>
        </div>
      </div>
      <ul class="reasons">
        ${(quality.reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}
      </ul>
    </div>

    <div class="actions">
      <button id="sendAristotle" ${canSubmit ? "" : "disabled"}>Send to Aristotle</button>
      <button id="pollAristotle" class="secondary" disabled>Check Aristotle status</button>
      <span class="meta" id="aristotleMeta">${canSubmit ? "Explicit click required; this may spend Aristotle credits." : "Skipped unless candidate quality is maybe/good."}</span>
    </div>
    <div id="aristotleResult"></div>

    <div class="meta">
      corpus: ${data.report.total} statements · ${data.report.solved} solved · ${data.report.misses} misses · Mathlib import ${data.report.importMs} ms
    </div>

    <div class="label" style="margin-top:14px">Lean statement</div>
    <pre>${esc(entry.statement)}</pre>
  `;
  $("sendAristotle").onclick = sendToAristotle;
  $("pollAristotle").onclick = pollAristotle;
}

async function sendToAristotle() {
  const send = $("sendAristotle");
  const poll = $("pollAristotle");
  send.disabled = true;
  $("aristotleMeta").textContent = "Submitting nonblocking Aristotle job...";
  $("aristotleResult").innerHTML = "";
  const response = await (await fetch("/api/aristotle-submit", {
    method: "POST",
    body: JSON.stringify({ entry: currentEntry })
  })).json();
  if (response.error) {
    $("aristotleMeta").textContent = "Submission failed.";
    $("aristotleResult").innerHTML = `<div class="error">${esc(response.error)}</div>`;
    return;
  }
  currentProjectId = response.projectId;
  $("aristotleMeta").textContent = `Submitted Aristotle project ${currentProjectId}.`;
  poll.disabled = false;
}

async function pollAristotle() {
  if (!currentProjectId) return;
  const poll = $("pollAristotle");
  poll.disabled = true;
  $("aristotleMeta").textContent = "Checking Aristotle status...";
  const response = await (await fetch(`/api/aristotle-status?projectId=${encodeURIComponent(currentProjectId)}`)).json();
  poll.disabled = false;
  if (response.error) {
    $("aristotleMeta").textContent = "Status check failed.";
    $("aristotleResult").innerHTML = `<div class="error">${esc(response.error)}</div>`;
    return;
  }
  $("aristotleMeta").textContent = `Aristotle status: ${response.status}`;
  if (response.proof) {
    $("aristotleResult").innerHTML = `
      <div class="label" style="margin-top:14px">Aristotle output (not locally trusted until reverified)</div>
      <pre>${esc(response.proof)}</pre>
      <div class="meta">downloaded from ${esc(response.proofPath || "archive")}</div>
    `;
  }
}

$("mine").onclick = async () => {
  const button = $("mine");
  button.disabled = true;
  $("result").innerHTML = `<div class="empty">Mining...</div>`;
  try {
    render(await (await fetch("/api/mine-next")).json());
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
