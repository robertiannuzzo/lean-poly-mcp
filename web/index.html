<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category Theory Miner and Proposer</title>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"], ["$", "$"]],
      displayMath: [["\\[", "\\]"], ["$$", "$$"]],
      processEscapes: true
    },
    svg: { fontCache: "global" },
    startup: { typeset: false }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  :root {
    --bg: #f7f7f4;
    --panel: #ffffff;
    --ink: #202124;
    --muted: #6d7178;
    --line: #dfe3e6;
    --accent: #275f76;
    --accent-ink: #ffffff;
    --ok: #217346;
    --miss: #a13f22;
    --code: #f0f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --panel: #191c20;
      --ink: #e7eaee;
      --muted: #a3a9b1;
      --line: #313740;
      --accent: #6bb3cf;
      --accent-ink: #081115;
      --ok: #75c991;
      --miss: #ed8b67;
      --code: #11161b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 34px 20px 56px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 720;
  }
  .subtitle {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  button {
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 650;
    padding: 9px 15px;
    cursor: pointer;
  }
  button:disabled {
    opacity: .55;
    cursor: default;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
  }
  .empty {
    color: var(--muted);
    padding: 28px 0;
    text-align: center;
  }
  .topline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 3px;
  }
  .decl {
    color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .badge {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .badge.solved {
    color: var(--ok);
  }
  .badge.miss {
    color: var(--miss);
  }
  .badge.good {
    color: var(--ok);
  }
  .badge.maybe {
    color: #9a6a14;
  }
  .badge.skip {
    color: var(--miss);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 12px 0;
  }
  .stat {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px;
    min-width: 0;
  }
  .stat div:last-child {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    overflow-wrap: anywhere;
  }
  pre {
    max-height: 430px;
    overflow: auto;
    margin: 10px 0 0;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--code);
    color: var(--ink);
    font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .summary-box {
    min-height: 150px;
    max-height: 560px;
    font: 14px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    white-space: pre-wrap;
  }
  .math-prose {
    overflow: auto;
    margin: 10px 0 0;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--code);
    color: var(--ink);
  }
  .math-prose mjx-container {
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
  }
  .meta {
    color: var(--muted);
    font-size: 12.5px;
  }
  .error {
    color: var(--miss);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
  }
  ul.reasons {
    margin: 8px 0 0;
    padding-left: 20px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 720px) {
    header { align-items: stretch; flex-direction: column; }
    button { width: 100%; }
    .topline { flex-direction: column; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Category Theory Miner and Proposer</h1>
      <div class="subtitle">Mining real <code>Mathlib.CategoryTheory</code> theorems, proposing new candidates, and screening both for Aristotle.</div>
    </div>
    <div class="actions" style="margin-top:0">
      <button id="mine">Mine statement</button>
      <button id="findCandidate" class="secondary">Find Aristotle candidate</button>
      <button id="proposeTheorem" class="secondary">Propose theorem</button>
    </div>
  </header>

  <section class="panel" id="result">
    <div class="empty">No statement mined yet.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let currentEntry = null;
let currentProjectId = null;
let currentProposal = null;
let aristotlePollTimer = null;
let aristotleStatusHistory = [];

function hasTexDelimiters(s) {
  return /\\\(|\\\[|\$\$|(^|[^\\])\$/.test(String(s));
}

function latexizePlainCategoryText(s) {
  let out = String(s);
  if (hasTexDelimiters(out)) return out;
  out = out.replace(/\b([A-Z][A-Za-z0-9']*)\s*:\s*([A-Z][A-Za-z0-9']*)\s*→\s*([A-Z][A-Za-z0-9']*)/g, "\\($1 : $2 \\to $3\\)");
  out = out.replace(/\b([A-Z][A-Za-z0-9']*)\s*:\s*([A-Z][A-Za-z0-9']*)\s*->\s*([A-Z][A-Za-z0-9']*)/g, "\\($1 : $2 \\to $3\\)");
  out = out.replace(/\b([A-Za-z][A-Za-z0-9']*)\s*∘\s*([A-Za-z][A-Za-z0-9']*)/g, "\\($1 \\circ $2\\)");
  out = out.replace(/\bcolim_([A-Za-z0-9]+)\s*\(([^)]+)\)/g, "\\(\\operatorname{colim}_{$1}($2)\\)");
  out = out.replace(/\bcolim_([A-Za-z0-9]+)\s+([A-Za-z][A-Za-z0-9']*)/g, "\\(\\operatorname{colim}_{$1} $2\\)");
  return out;
}

function proseHtml(s) {
  return esc(latexizePlainCategoryText(s)).replace(/\n/g, "<br>");
}

function renderMath(root = $("result")) {
  if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
    window.MathJax.typesetPromise([root]).catch(() => {});
  }
}

function stopAristotlePolling() {
  if (aristotlePollTimer) {
    clearTimeout(aristotlePollTimer);
    aristotlePollTimer = null;
  }
}

function isTerminalStatus(status) {
  return ["COMPLETE", "COMPLETED", "SUCCEEDED", "DONE", "FAILED", "ERROR", "CANCELLED", "CANCELED"].includes(String(status || "").toUpperCase());
}

function setAristotleStatus(status, suffix = "") {
  const normalized = String(status || "UNKNOWN").toUpperCase();
  if (aristotleStatusHistory[aristotleStatusHistory.length - 1] !== normalized) {
    aristotleStatusHistory.push(normalized);
  }
  const trail = aristotleStatusHistory.length > 1 ? ` · ${aristotleStatusHistory.join(" -> ")}` : "";
  $("aristotleMeta").textContent = `Aristotle status: ${normalized}${trail}${suffix}`;
}

function scheduleAristotlePoll(delayMs = 15000) {
  stopAristotlePolling();
  aristotlePollTimer = setTimeout(() => pollAristotle({ auto: true }), delayMs);
}

function render(data) {
  stopAristotlePolling();
  if (data.error) {
    $("result").innerHTML = `<div class="error">${esc(data.error)}</div>`;
    return;
  }

  const entry = data.entry;
  const verdict = entry.verdict || {};
  const quality = entry.quality || { label: "skip", score: 0, reasons: [] };
  const solved = verdict.outcome === "solved";
  const miss = verdict.outcome === "interesting_miss";
  const tried = verdict.tried || [];
  const axioms = verdict.axioms || [];
  const badge = solved ? "solved locally" : miss ? "interesting miss" : verdict.outcome || "unknown";
  const canSubmit = miss && quality.label !== "skip";
  currentEntry = entry;
  currentProposal = entry.proposal || null;
  currentProjectId = null;
  aristotleStatusHistory = [];

  $("result").innerHTML = `
    ${data.message ? `<div class="panel" style="padding:12px; margin-bottom:12px"><span class="meta">${esc(data.message)}</span></div>` : ""}
    <div class="topline">
      <div>
        <div class="label">${entry.source === "agentic_conjecture" ? "Agentic proposal" : "Mathlib declaration"}</div>
        <div class="decl">${esc(entry.name)}</div>
      </div>
      <div class="badge ${solved ? "solved" : miss ? "miss" : ""}">${esc(badge)}</div>
    </div>

    <div class="grid">
      <div class="stat"><div class="label">topic</div><div>${esc(entry.topic)}</div></div>
      <div class="stat"><div class="label">position</div><div>${data.index}/${data.count}${data.scanned ? ` · scanned ${data.scanned}` : ""}</div></div>
      <div class="stat"><div class="label">local result</div><div>${esc(entry.summary)}</div></div>
      <div class="stat"><div class="label">${solved ? "axioms" : "tried"}</div><div>${solved ? esc(axioms.join(", ") || "none") : tried.length}</div></div>
    </div>

    <div class="panel" style="padding:12px; margin-top:12px">
      <div class="topline" style="margin-bottom:0">
        <div>
          <div class="label">Aristotle candidate quality</div>
          <div><span class="badge ${esc(quality.label)}">${esc(quality.label)} · ${quality.score}/100</span></div>
        </div>
      </div>
      <ul class="reasons">
        ${(quality.reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}
      </ul>
    </div>

    <div class="actions">
      <button id="sendAristotle" ${canSubmit ? "" : "disabled"}>Send to Aristotle</button>
      <button id="pollAristotle" class="secondary" disabled>Check Aristotle status</button>
      <span class="meta" id="aristotleMeta">${canSubmit ? "Explicit click required; this may spend Aristotle credits." : "Skipped unless candidate quality is maybe/good."}</span>
    </div>
    <div id="aristotleResult"></div>

    <div class="meta">
      corpus: ${data.report.total} statements · ${data.report.solved} solved · ${data.report.misses} misses · Mathlib import ${data.report.importMs} ms
    </div>

    <div class="label" style="margin-top:14px">Lean statement</div>
    <pre>${esc(entry.statement)}</pre>
  `;
  $("sendAristotle").onclick = sendToAristotle;
  $("pollAristotle").onclick = pollAristotle;
}

function renderProposal(data) {
  stopAristotlePolling();
  if (data.error) {
    $("result").innerHTML = `<div class="error">${esc(data.error)}</div>`;
    return;
  }
  const proposal = data.proposal;
  currentProposal = proposal;
  currentEntry = null;
  currentProjectId = null;
  aristotleStatusHistory = [];
  $("result").innerHTML = `
    <div class="topline">
      <div>
        <div class="label">Agentic theorem proposal</div>
        <div class="decl">${esc(proposal.title)}</div>
      </div>
      <div class="badge maybe">proposed</div>
    </div>

    <div class="grid">
      <div class="stat"><div class="label">topic</div><div>${esc(proposal.topic)}</div></div>
      <div class="stat"><div class="label">source</div><div>${esc(proposal.provider?.name || "local")}${proposal.provider?.model ? ` · ${esc(proposal.provider.model)}` : ""}</div></div>
      <div class="stat"><div class="label">seed</div><div>${esc(proposal.seed.name || "none")}</div></div>
      <div class="stat"><div class="label">gate</div><div>human click</div></div>
    </div>
    ${proposal.provider?.fallback ? `<div class="panel" style="padding:12px; margin-top:12px"><span class="meta">Provider fallback: ${esc(proposal.provider.error || "using local proposal")}</span></div>` : ""}

    <div class="label" style="margin-top:14px">Proposed theorem in prose</div>
    <div class="summary-box math-prose">${proseHtml(proposal.prose)}</div>

    <div class="panel" style="padding:12px; margin-top:12px">
      <div class="label">Self-revising discovery chain</div>
      <ul class="reasons">
        ${(proposal.chain || []).map(step => `<li><strong>${esc(step.artifact)}</strong> · ${esc(step.status)} · ${proseHtml(step.text)}</li>`).join("")}
      </ul>
    </div>

    <div class="panel" style="padding:12px; margin-top:12px">
      <div class="label">Rationale</div>
      <div class="meta">${esc(proposal.rationale)}</div>
    </div>

    <div class="actions">
      <button id="formalizeAristotle">Formalize with Aristotle</button>
      <span class="meta" id="formalizeMeta">Explicit click required; this may spend Aristotle credits.</span>
    </div>
    <div id="formalizeResult"></div>
  `;
  $("formalizeAristotle").onclick = formalizeWithAristotle;
  renderMath();
}

async function formalizeWithAristotle() {
  if (!currentProposal) return;
  const button = $("formalizeAristotle");
  button.disabled = true;
  $("formalizeMeta").textContent = "Waiting for Aristotle to formalize the prose theorem...";
  $("formalizeResult").innerHTML = "";
  const response = await (await fetch("/api/aristotle-formalize", {
    method: "POST",
    body: JSON.stringify({ proposal: currentProposal })
  })).json();
  if (response.error) {
    button.disabled = false;
    $("formalizeMeta").textContent = "Formalization failed.";
    $("formalizeResult").innerHTML = `
      <div class="error">${esc(response.error)}</div>
      ${response.raw ? `<div class="label" style="margin-top:10px">raw Aristotle output</div><pre>${esc(response.raw)}</pre>` : ""}
    `;
    return;
  }
  $("formalizeMeta").textContent = response.wellFormed
    ? "Formalized statement parses in Lean; proof submission is still explicit."
    : "Formalized statement did not parse locally.";
  render({
    index: 1,
    count: 1,
    report: { total: 1, solved: 0, misses: response.wellFormed ? 1 : 0, unusable: response.wellFormed ? 0 : 1, importMs: 0 },
    entry: response.entry,
    message: "Agentic pre-chain produced prose, Aristotle formalized it, and the local parser checked the statement shape."
  });
}

async function sendToAristotle() {
  const send = $("sendAristotle");
  const poll = $("pollAristotle");
  stopAristotlePolling();
  aristotleStatusHistory = [];
  send.disabled = true;
  $("aristotleMeta").textContent = "Submitting nonblocking Aristotle job...";
  $("aristotleResult").innerHTML = "";
  const response = await (await fetch("/api/aristotle-submit", {
    method: "POST",
    body: JSON.stringify({ entry: currentEntry })
  })).json();
  if (response.error) {
    $("aristotleMeta").textContent = "Submission failed.";
    $("aristotleResult").innerHTML = `
      <div class="error">${esc(response.error)}</div>
      ${response.raw ? `<div class="label" style="margin-top:10px">raw Aristotle output</div><pre>${esc(response.raw)}</pre>` : ""}
    `;
    return;
  }
  currentProjectId = response.projectId;
  $("aristotleMeta").textContent = `Submitted Aristotle project ${currentProjectId}. First status check starting...`;
  poll.disabled = false;
  scheduleAristotlePoll(1500);
}

async function pollAristotle(options = {}) {
  if (!currentProjectId) return;
  const auto = Boolean(options.auto);
  const poll = $("pollAristotle");
  stopAristotlePolling();
  poll.disabled = true;
  if (!auto) {
    $("aristotleMeta").textContent = "Checking Aristotle status...";
  }
  const response = await (await fetch(`/api/aristotle-status?projectId=${encodeURIComponent(currentProjectId)}`)).json();
  poll.disabled = false;
  if (response.error) {
    $("aristotleMeta").textContent = "Status check failed.";
    $("aristotleResult").innerHTML = `
      <div class="transient-status">
        <div class="label" style="margin-top:14px">Transient Aristotle status error</div>
        <div class="error">${esc(response.error)}</div>
      </div>
    `;
    if (auto) {
      scheduleAristotlePoll();
    }
    return;
  }
  setAristotleStatus(response.status, isTerminalStatus(response.status) ? "" : " · polling every 15s");
  if (response.proof) {
    $("aristotleResult").innerHTML = `
      ${response.summary ? `<div class="label" style="margin-top:14px">Aristotle summary</div><pre class="summary-box">${esc(response.summary)}</pre>` : ""}
      <div class="label" style="margin-top:14px">Aristotle output (not locally trusted until reverified)</div>
      <pre>${esc(response.proof)}</pre>
      <div class="meta">downloaded from ${esc(response.proofPath || "archive")}</div>
    `;
  } else if (response.downloadError) {
    $("aristotleResult").innerHTML = `
      <div class="label" style="margin-top:14px">Aristotle download error</div>
      <div class="error">${esc(response.downloadError)}</div>
    `;
  } else if (response.downloaded) {
    $("aristotleResult").innerHTML = `
      ${response.summary ? `<div class="label" style="margin-top:14px">Aristotle summary</div><pre class="summary-box">${esc(response.summary)}</pre>` : ""}
      <div class="label" style="margin-top:14px">Downloaded artifact</div>
      <pre>${esc((response.downloadFiles || []).join("\n") || "No files listed in downloaded artifact.")}</pre>
      <div class="meta">No Lean proof file matching the expected theorem shape was found.</div>
    `;
  } else {
    const stale = $("aristotleResult").querySelector(".transient-status");
    if (stale) {
      $("aristotleResult").innerHTML = "";
    }
  }
  if (!isTerminalStatus(response.status)) {
    scheduleAristotlePoll();
  }
}

$("mine").onclick = async () => {
  const button = $("mine");
  const other = $("findCandidate");
  const proposer = $("proposeTheorem");
  button.disabled = true;
  other.disabled = true;
  proposer.disabled = true;
  $("result").innerHTML = `<div class="empty">Mining...</div>`;
  try {
    render(await (await fetch("/api/mine-next")).json());
  } finally {
    button.disabled = false;
    other.disabled = false;
    proposer.disabled = false;
  }
};

$("findCandidate").onclick = async () => {
  const button = $("findCandidate");
  const other = $("mine");
  const proposer = $("proposeTheorem");
  button.disabled = true;
  other.disabled = true;
  proposer.disabled = true;
  $("result").innerHTML = `<div class="empty">Scanning cached corpus for a maybe/good Aristotle candidate...</div>`;
  try {
    render(await (await fetch("/api/find-candidate")).json());
  } finally {
    button.disabled = false;
    other.disabled = false;
    proposer.disabled = false;
  }
};

$("proposeTheorem").onclick = async () => {
  const button = $("proposeTheorem");
  const mine = $("mine");
  const find = $("findCandidate");
  button.disabled = true;
  mine.disabled = true;
  find.disabled = true;
  $("result").innerHTML = `<div class="empty">Building typed theorem-proposal chain...</div>`;
  try {
    renderProposal(await (await fetch("/api/propose-theorem")).json());
  } finally {
    button.disabled = false;
    mine.disabled = false;
    find.disabled = false;
  }
};
</script>
</body>
</html>
